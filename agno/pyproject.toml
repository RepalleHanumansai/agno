[tool.poetry]
name = "agno"
version = "0.1.0"
description = "AGNO - Modular AI Agent Platform with RAG, ML, NLP, and Chatbot"
authors = ["Your Name <you@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = "^0.25"
pydantic = "^2.5"
numpy = "^1.26"
pandas = "^2.1"
scikit-learn = "^1.3"
nltk = "^3.9"
transformers = "^4.34"
sentence-transformers = "^2.2"
faiss-cpu = "^1.7"
python-dotenv = "^1.0"
streamlit = "^1.27"
requests = "^2.31"

[tool.poetry.dev-dependencies]
pytest = "^7.4"
black = "^24.3"
isort = "^6.0"
mypy = "^1.5"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
